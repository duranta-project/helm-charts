# SPDX-License-Identifier: MIT
#
#   E2  (E2AP):  192.168.85.0/24  -> 192.168.85.95 (FlexRIC is .90)
#
# Multus override for duranta-oai-du — F1 subnet matching the CU override:
#
#   F1C (F1 Control): 172.21.16.0/22 → DU: 172.21.16.91  (CU is .90)
#   F1U (F1 User):    172.21.16.0/22 → DU: 172.21.16.92
#
# cuHost must point to the CU's F1 multus IP because the CU binds F1 to
# that interface (not to the pod's primary eth0 / service ClusterIP).

config:
  ricHost: "192.168.85.90"   # FlexRIC E2 multus address (used with config.enableE2)
  cuHost: "172.21.16.90"

multus:
  enabled: true
  interfaces:
    - name: "f1c"
      hostInterface: "eth0"
      ipAdd: "172.21.16.91"
      netmask: "22"
      defaultRoute: ""
      enabled: true
      type: macvlan
      mode: "bridge"
    - name: "f1u"
      hostInterface: "eth0"
      ipAdd: "172.21.16.92"
      netmask: "22"
      defaultRoute: ""
      enabled: true
      type: macvlan
      mode: "bridge"
    - name: "e2"
      hostInterface: "eth0"
      ipAdd: "192.168.85.95"
      netmask: "24"
      enabled: true
      type: macvlan
      mode: "bridge"
    - name: "ru"
      enabled: false
