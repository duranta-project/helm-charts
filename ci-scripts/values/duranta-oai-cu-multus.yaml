# SPDX-License-Identifier: MIT
#
#   E2  (E2AP):  192.168.85.0/24  -> 192.168.85.92 (FlexRIC is .90)
#
# Multus override for duranta-oai-cu — dedicated subnets matching the core override:
#
#   N2  (NGAP):  172.21.6.0/22   → CU: 172.21.6.91   (AMF is .90)
#   F1  (F1AP):  172.21.16.0/22  → CU: 172.21.16.90
#   N3  (GTP):   10.10.5.0/24   → CU: 10.10.5.3    (UPF is .2)
#
# amfHost must point to the AMF's N2 multus IP because the AMF binds NGAP
# to that interface (not to the pod's primary eth0 / service ClusterIP).

config:
  ricHost: "192.168.85.90"   # FlexRIC E2 multus address (used with config.enableE2)
  amfHost: "172.21.6.90"

multus:
  enabled: true
  interfaces:
    - name: "n2"
      hostInterface: "eth0"
      ipAdd: "172.21.6.91"
      netmask: "22"
      defaultRoute: ""
      enabled: true
      type: macvlan
      mode: "bridge"
    - name: "f1"
      hostInterface: "eth0"
      ipAdd: "172.21.16.90"
      netmask: "22"
      defaultRoute: ""
      enabled: true
      type: macvlan
      mode: "bridge"
    - name: "n3"
      hostInterface: "eth0"
      ipAdd: "10.10.5.3"
      netmask: "24"
      defaultRoute: ""
      enabled: true
      type: macvlan
      mode: "bridge"
    - name: "e2"
      hostInterface: "eth0"
      ipAdd: "192.168.85.92"
      netmask: "24"
      enabled: true
      type: macvlan
      mode: "bridge"
