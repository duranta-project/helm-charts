#
# OAI 5G-Basic core network configuration — multus variant
#
# Changed from the default config.yaml:
#   nfs.amf.n2.interface_name  : eth0 → n2   (macvlan, 172.21.6.90/22)
#   nfs.smf.n4.interface_name  : eth0 → n4   (macvlan, 192.168.24.3/24)
#   nfs.upf.n3.interface_name  : eth0 → n3   (macvlan, 10.10.5.2/24)
#   nfs.upf.n4.interface_name  : eth0 → n4   (macvlan, 192.168.24.2/24)
#
# SBI interfaces stay on eth0 so NRF discovery over the cluster network works.

############# Common configuration

log_level:
  general: debug

register_nf:
  general: yes

http_version: 2
curl_timeout: 6000

snssais:
  - &embb_slice1
    sst: 1
  - &embb_slice2
    sst: 1
    sd: FFFFFF

############## SBI Interfaces

nfs:
  amf:
    host: oai-amf
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
    n2:
      interface_name: n2       # multus macvlan — 172.21.6.90/22
      port: 38412
  smf:
    host: oai-smf
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
    n4:
      interface_name: n4       # multus macvlan — 192.168.24.3/24
      port: 8805
  upf:
    host: oai-upf
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
    n3:
      interface_name: n3       # multus macvlan — 10.10.5.2/24
      port: 2152
    n4:
      interface_name: n4       # multus macvlan — 192.168.24.2/24
      port: 8805
    n6:
      interface_name: eth0
    n9:
      interface_name: eth0
      port: 2152
  udm:
    host: oai-udm
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
  udr:
    host: oai-udr
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
  lmf:
    host: oai-lmf
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
  ausf:
    host: oai-ausf
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0
  nrf:
    host: oai-nrf
    sbi:
      port: 80
      api_version: v1
      interface_name: eth0

#### Common for UDR and AMF
database:
  host: mysql
  user: test
  type: mysql
  password: test
  database_name: oai_db
  generate_random: true
  connection_timeout: 300

############## NF-specific configuration

amf:
  amf_name: "OAI-AMF"
  support_features_options:
    enable_simple_scenario: no
    enable_nssf: no
    enable_smf_selection: yes
  relative_capacity: 30
  statistics_timer_interval: 20
  emergency_support: false
  served_guami_list:
    - mcc: 001
      mnc: 01
      amf_region_id: 01
      amf_set_id: 001
      amf_pointer: 01
  plmn_support_list:
    - mcc: 001
      mnc: 01
      tac: 0x0001
      nssai:
        - *embb_slice1
        - *embb_slice2
  supported_integrity_algorithms:
    - "NIA1"
    - "NIA2"
  supported_encryption_algorithms:
    - "NEA0"
    - "NEA1"
    - "NEA2"

smf:
  ue_mtu: 1500
  support_features:
    use_local_subscription_info: no
    use_local_pcc_rules: yes
  upfs:
    - host: 192.168.24.2   # UPF N4 multus address: the UPF registers it in the NRF and the SMF matches this entry on it
      config:
        enable_usage_reporting: no
  ue_dns:
    primary_ipv4: "10.3.2.200"
    primary_ipv6: "2001:4860:4860::8888"
    secondary_ipv4: "8.8.8.8"
    secondary_ipv6: "2001:4860:4860::8888"
  ims:
    pcscf_ipv4: "192.168.70.139"
    pcscf_ipv6: "fe80::7915:f408:1787:db8b"
  smf_info:
    sNssaiSmfInfoList:
      - sNssai: *embb_slice1
        dnnSmfInfoList:
          - dnn: "oai"
      - sNssai: *embb_slice2
        dnnSmfInfoList:
          - dnn: "ims"
  local_subscription_infos:
    - single_nssai: *embb_slice1
      dnn: "oai"
      qos_profile:
        5qi: 9
        session_ambr_ul: "200Mbps"
        session_ambr_dl: "400Mbps"
    - single_nssai: *embb_slice2
      dnn: "ims"
      qos_profile:
        5qi: 2
        session_ambr_ul: "100Mbps"
        session_ambr_dl: "200Mbps"

lmf:
  http_threads_count: 8
  gnb_id_bits_count: 28
  num_gnb: 1
  trp_info_wait_ms: 10000
  positioning_wait_ms: 10000
  measurement_wait_ms: 10000
  support_features:
    request_trp_info: no
    determine_num_gnb: yes
    use_http2: yes
    use_fqdn_dns: no
    register_nrf: yes

upf:
  support_features:
    enable_bpf_datapath: no
    enable_snat: yes
  remote_n6_gw: 127.0.0.1
  upf_info:
    sNssaiUpfInfoList:
    - sNssai: *embb_slice1
      dnnUpfInfoList:
        - dnn: oai
    - sNssai: *embb_slice2
      dnnUpfInfoList:
        - dnn: ims

dnns:
  - dnn: "oai"
    pdu_session_type: "IPV4"
    ipv4_subnet: "12.1.1.0/24"
  - dnn: "ims"
    pdu_session_type: "IPV4V6"
    ipv4_subnet: "14.1.1.0/24"
