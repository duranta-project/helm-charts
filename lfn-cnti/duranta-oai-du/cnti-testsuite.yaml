# SPDX-License-Identifier: Apache-2.0
# CNTi Test Suite (https://github.com/lfn-cnti/testsuite) configuration: Duranta OAI DU
# Run with lfn-cnti/runCNTI.sh duranta-oai-du; the core (oai-core) and a CU (oai-cnti-deps) run outside the CNF
config_version: "v2"
common:
  # placeholders of the config template, replaced at start with the pod's addresses
  hardcoded_ip_exceptions:
    - ip: 192.168.71.150
    - ip: 192.168.71.171
deployments:
  helm_dirs:
    - name: duranta-oai-du
      helm_directory: ../../charts/duranta-oai-du
      namespace: oai-cnti
      helm_values: "--set config.cuHost=oai-cu.oai-cnti-deps.svc.cluster.local"
