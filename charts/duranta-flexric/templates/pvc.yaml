{{- if .Values.xappDb.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Chart.Name }}-xapp-db
  labels:
    app: {{ .Release.Name }}
    {{- include "duranta-flexric.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.xappDb.accessMode }}
  {{- if .Values.xappDb.storageClass }}
  storageClassName: {{ .Values.xappDb.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.xappDb.size }}
{{- end }}
