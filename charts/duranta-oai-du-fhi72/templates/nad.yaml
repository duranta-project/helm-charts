{{- if .Values.multus.enabled }}
{{- range .Values.multus.interfaces }}
{{- if .enabled }}

{{- if eq (default "macvlan" .type) "macvlan" }}
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $.Release.Name }}-{{ .name }}-{{ $.Chart.Name }}
  labels:
    app: {{ $.Release.Name }}-{{ .name }}-{{ $.Chart.Name }}
spec:
  config: '{
    "cniVersion": "0.3.1",
    "name": "{{ $.Release.Name }}-{{ .name }}-{{ $.Chart.Name }}",
    "plugins": [
      {
        "type": "macvlan",
        "master": "{{ .hostInterface }}",
        "mode": "{{ default "bridge" .mode }}",
        {{- if .mtu }}
        "mtu": {{ .mtu }},
        {{- end }}
        "ipam": {
          "type": "static",
          "addresses": [
            { "address": "{{ .ipAdd }}/{{ .netmask }}" }
          ]
          {{- if .routes }},
          "routes": {{ toJson .routes }}
          {{- end }}
          {{- if .gateway }},
          "gateway": "{{ .gateway }}"
          {{- end }}
        }
      }
      ]
  }'
---
{{- end }}

{{- if eq .type "vlan" }}
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: {{ $.Release.Name }}-{{ .name }}-{{ $.Chart.Name }}
  labels:
    app: {{ $.Release.Name }}-{{ .name }}-{{ $.Chart.Name }}
spec:
  config: '{
    "cniVersion": "0.3.1",
    "type": "vlan",
    "master": "{{ .hostInterface }}",
    "vlanId": {{ .vlan }},
    {{- if .mtu }}
    "mtu": {{ .mtu }},
    {{- end }}
    "ipam": {
      "type": "static",
      "addresses": [
        { "address": "{{ .ipAdd }}/{{ .netmask }}" }
      ]
      {{- if .routes }},
      "routes": {{ toJson .routes }}
      {{- end }}
      {{- if .gateway }},
      "gateway": "{{ .gateway }}"
      {{- end }}
    }
  }'
---
{{- end }}

{{- if eq .type "sriov" }}
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetwork
metadata:
  name: {{ $.Release.Name }}-{{ .name }}-{{ $.Chart.Name }}
  namespace: {{ .sriovNetworkNamespace }}
  labels:
    app: {{ $.Release.Name }}-{{ .name }}-{{ $.Chart.Name }}
spec:
  networkNamespace: {{ $.Release.Namespace }}
  resourceName: {{ .sriovResourceName }}
  vlan: {{ .vlan | default 1 }}
  spoofChk: "off"
  trust: "on"
  capabilities: '{ "mac": true }'
---
{{- end }}

{{- end }}
{{- end }}
{{- end }}
